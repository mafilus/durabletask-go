name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the tagged release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          release_notes="docs/releases/$RELEASE_TAG.md"
          test -s "$release_notes"
          IFS= read -r release_title < "$release_notes"
          [[ "$release_title" == "# $RELEASE_TAG:"* ]]
          if [[ "$release_title" == *unreleased* ]]; then
            echo "Release notes are still marked unreleased" >&2
            exit 1
          fi
          # A rerun must not overwrite a release that has already been published.
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            test "$(< "$RUNNER_TEMP/release-is-draft")" = false
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "${release_title#\# }" --notes-file "$release_notes"
