name: PostgreSQL durability lab

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Durability test category
        required: true
        default: guarantees
        type: choice
        options:
          - guarantees
          - known-defects
          - stress
          - all
      test_pattern:
        description: Optional Go -run override (takes precedence over suite)
        required: false
        default: ""
        type: string
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        default: "20"
        type: string

permissions:
  contents: read

env:
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: durabletask
  # The GitHub Actions PostgreSQL service does not expose TLS.
  PGSSLMODE: disable
  POSTGRES_CONNECTION_STRING: postgres://postgres:postgres@127.0.0.1:5432/durabletask?sslmode=disable

jobs:
  postgres-durability:
    name: PostgreSQL ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: durabletask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d durabletask"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare diagnostics
        run: mkdir -p artifacts

      - name: Record environment
        shell: bash
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "suite=${{ inputs.suite }}"
            echo "runner=${RUNNER_OS} ${RUNNER_ARCH}"
            go version
            psql --version
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"
          } | tee artifacts/environment.txt

      - name: Run PostgreSQL durability tests
        shell: bash
        run: |
          set -o pipefail
          pattern="${{ inputs.test_pattern }}"

          if [[ -z "$pattern" ]]; then
            case "${{ inputs.suite }}" in
              guarantees)
                pattern='^(TestActivityRedeliveredAfterLeaseExpiryAndStaleCompletionRollsBack|TestWorkflowRedeliveredAfterLeaseExpiry|TestDurableTimerSurvivesBackendRestart)$'
                ;;
              known-defects)
                pattern='^TestKnownDefect'
                export STRIX_RUN_KNOWN_DEFECTS=1
                ;;
              stress)
                pattern='^TestStress'
                ;;
              all)
                pattern=''
                export STRIX_RUN_KNOWN_DEFECTS=1
                ;;
            esac
          elif [[ "${{ inputs.suite }}" == "known-defects" || "${{ inputs.suite }}" == "all" ]]; then
            export STRIX_RUN_KNOWN_DEFECTS=1
          fi

          args=(./backend/postgres/... -count=1 -v)
          if [[ -n "$pattern" ]]; then
            args+=( -run "$pattern" )
          fi

          echo "suite=${{ inputs.suite }} pattern=${pattern:-<all>}" | tee artifacts/selection.txt
          go test "${args[@]}" 2>&1 | tee artifacts/go-test.log

      - name: Capture PostgreSQL diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "=== pg_stat_activity ==="
            psql -X -v ON_ERROR_STOP=0 -c "SELECT pid, state, wait_event_type, wait_event, query_start, left(query, 300) AS query FROM pg_stat_activity WHERE datname = current_database() ORDER BY pid;"
            echo
            echo "=== durabletask tables ==="
            psql -X -v ON_ERROR_STOP=0 -c "SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog', 'information_schema') ORDER BY schemaname, tablename;"
          } > artifacts/postgres.txt 2>&1 || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
