services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: durabletask
    ports:
      - "${POSTGRES_CHAOS_PORT:-5432}:5432"
    volumes:
      - postgres-chaos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d durabletask"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-chaos-data:
